[package]
name = "av-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
notify-debouncer-mini = "0.7"

[dev-dependencies]
tempfile = "3"
