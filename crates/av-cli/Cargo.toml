[package]
name = "av-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "av"
path = "src/main.rs"

[dependencies]
av-core = { path = "../av-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
